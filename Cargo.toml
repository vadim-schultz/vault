[package]
name = "vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Automatic version history — init once, retrieve any version later"
license = "MIT"
repository = "https://github.com/vadim-schultz/vault"
readme = "README.md"

[dependencies]
anyhow = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
fs4 = { version = "1", features = ["sync"] }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
gix = { version = "0.73.0", default-features = false, features = ["tree-editor", "parallel"] }
globset = "0.4"
notify = "8"
notify-debouncer-full = "0.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "2.7.0"
thiserror = "2.0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "0.9.6"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2"
criterion = "0.5.1"
predicates = "3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tempfile = "3.27.0"

[[bench]]
name = "history_depth"
harness = false

[[bench]]
name = "file_count"
harness = false

[[bench]]
name = "vault_count"
harness = false

[[bench]]
name = "queue_latency"
harness = false

[[bench]]
name = "housekeeping"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
